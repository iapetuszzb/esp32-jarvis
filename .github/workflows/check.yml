name: Build and protocol checks
on: [push, pull_request, workflow_dispatch]
jobs:
  server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install -r server/requirements-test.txt
      - run: python -m pytest -q
        working-directory: server
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install platformio==6.2.0
      - run: pio run -d firmware
      - run: python tools/package_firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: esp32s3-firmware
          path: artifacts/release/*
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python tools/fetch_wake_model.py
      - run: bash gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-not-release-signed
          path: android/app/build/outputs/apk/debug/*.apk
